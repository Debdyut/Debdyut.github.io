name: github pages

on:
  push:
    branches:
      - develop/hugo-site
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
          with:
            submodules: true
            fetch-depth: 0

        - name: Setup Hugo
          uses: peaceiris/actions-hugo@v2.6.0
          with:
            hugo-version: 'latest'
            extended: true

        - name: Build
          run: cd portfolio && hugo --minify

        - name: Deploy
          uses: peaceiris/actions-gh-pages@v3
          if: github.ref == 'refs/heads/develop/hugo-site'
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./portfolio/public

